<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detail</title>
</head>
<body>
    <h1>DETAIL</h1>
    <a href="/todos">Home</a>

    <!-- Thymeleaf의 기능: todo.getTitle()을 내부적으로 호출! -->
    <h2 th:text="${todo.title}"></h2>
    <h4 th:text="${todo.content}"></h4>
    <p th:text="${todo.completed ? '완료' : '미완료'}"></p>

    <hr>
    <a th:href="@{/todos/{id}/edit(id=${todo.id})}">edit</a>
    <a th:href="@{/todos/{id}/delete(id=${todo.id})}">Delete</a>
</body>
</html>
